# rsyslog configuration of the NS8 Carbonio container: every message goes
# to the container output, collected by journald on the node.
global(workDirectory="/var/spool/rsyslog")
module(load="imuxsock")
template(name="ns8" type="string" string="%syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")
# Session messages of the "su" calls of the Carbonio scripts are noise
if $programname == "su" or $syslogfacility-text == "authpriv" then stop
if $syslogseverity <= 6 then action(type="omfile" file="/dev/stdout" template="ns8")
